# regin configuration. Env vars (REGIN_*) override these.

[model]
provider = "anthropic"
name = "claude-sonnet-5"
max_output_tokens = 16000
# "low" | "medium" | "high" | "xhigh" | "max". Sampling parameters are rejected with a
# 400 on this model family, so effort is the only depth control.
effort = "high"

[loop]
max_turns = 40
max_run_cost_usd = 2.00      # hard ceiling — the loop aborts, it does not warn
context_limit_tokens = 180000
compact_at = 0.75

# Retry is always on: a rate limit mid-sweep is not an agent failure.
retry_attempts = 4

# --- Phase 3 experiments -----------------------------------------------------
# Every flag below is off, and that is the point. This project's rule is that no
# orchestration change merges without a re-scored before/after, so the shipped
# default must stay the measured baseline. Turn exactly one on, re-run the sweep,
# and compare — the scorecard groups by config_hash, so both appear side by side.

# 3.4 — one planning turn before any edit.
plan_first = false
planner_effort = "medium"    # its own knob: plan depth is independent of loop depth
planner_max_tokens = 2048

# 3.2 — expose the `outline` tool (signatures instead of whole files).
outline_tool = false

# 3.3 — expose `search_agent`, a read-only subagent with its own context.
subagent_tool = false
subagent_max_turns = 12

[tools]
bash_timeout_s = 120
max_tool_output_chars = 30000

[permissions]
# "ask" | "allow" | "deny" per tool. --yes forces allow for benchmark runs.
read_file = "allow"
glob = "allow"
grep = "allow"
write_file = "ask"
edit_file = "ask"
bash = "ask"

[trace]
db_path = "runs/regin.db"
jsonl_path = "runs/records.jsonl"
